server.port=8086
spring.application.name=authserviceweb

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/minz_authweb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT
app.jwt.secret=MINZBOOK_SUPER_SECRETO_WEB_2025_ABC_987654321
app.jwt.expiration-ms=7200000   # 2 horas

# CORS (para tu frontend React)
# Cambia http://localhost:5173 si tu front usa otro puerto
cors.allowed.origins=http://localhost:5173
