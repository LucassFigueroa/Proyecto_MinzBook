<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>MinzBook — Autor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="header">
  <div class="nav">
    <a class="brand" href="index.html">
      <img src="img/logo.png" alt="MinzBook">
      <div><strong>MinzBook</strong><br><small class="subtitle">Libros de la mas ALTISIMA calidad.</small></div>
    </a>
    <nav class="menu">
      <a href="productos.html">Tienda</a>
      <a href="Contacto.html">Contacto</a>
      <a href="autor.html">Autor</a>
      <a href="carrito.html">Carrito <span class="badge" data-cart-count style="display:none">0</span></a>
      <span data-userbox></span>
    </nav>
  </div>
</header>
<main class="container">
  <h1>Autor</h1>
  <h2>Libros del autor </h2>
  <table class="table"><thead><tr><th>ISBN</th><th>Título</th><th>Autor</th><th>Precio</th></tr></thead><tbody id="adminBooks"></tbody></table>
  <h2 style="margin-top:16px">Crear libro </h2>
  <form id="formBook">
    <label for="isbn">ISBN</label><input id="isbn" name="isbn" required>
    <label for="titulo">Título</label><input id="titulo" name="titulo" required maxlength="100">
    <label for="autor">Autor</label><input id="autor" name="autor" required maxlength="80">
    <label for="genero">Género</label><input id="genero" name="genero" maxlength="60">
    <label for="precio">Precio</label><input id="precio" name="precio" type="number" min="0" step="10" required>
    <button class="btn primary" type="submit">Guardar</button>
  </form>
  <h2 style="margin-top:16px">Usuarios registrados</h2>
  <table class="table"><thead><tr><th>Nombre</th><th>Email</th></tr></thead><tbody id="adminUsers"></tbody></table>
  
</main>
<footer class="footer"><div class="inner"><span>© 2025 MinzBook</span><span class="subtitle">Hecho por Lucas y Matias :3 🍃</span></div></footer>
<script src="js/app.js"></script>
</body>
</html>
