<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>MinzBook — Registro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="header">
  <div class="nav">
    <a class="brand" href="index.html">
      <img src="img/logo.png" alt="MinzBook">
      <div><strong>MinzBook</strong><br><small class="subtitle">Libros de la mas ALTISIMA calidad.</small></div>
    </a>
    <nav class="menu">
      <a href="productos.html">Tienda</a>
      <a href="Contacto.html">Contacto</a>
      <a href="autor.html">Autor</a>
      <a href="carrito.html">Carrito <span class="badge" data-cart-count style="display:none">0</span></a>
      <span data-userbox></span>
    </nav>
  </div>
</header>
<main class="container">
  <h1>Crear cuenta</h1>
  <form id="formReg">
    <label for="nombre">Nombre completo</label><input id="nombre" name="nombre" required maxlength="80">
    <label for="email">Correo</label><input id="email" name="email" type="email" required maxlength="100" placeholder="tucorreo@duoc.cl">
    <span class="help">Se permiten dominios: duoc.cl, profesor.duoc.cl, gmail.com</span>
    <label for="pass">Contraseña</label><input id="pass" name="pass" type="password" required minlength="4" maxlength="20">
    <button class="btn primary" type="submit">Registrarme</button>
  </form>
</main>
<footer class="footer"><div class="inner"><span>© 2025 MinzBook</span><span class="subtitle">Hecho por Lucas y Matias :3 🍃</span></div></footer>
<script src="js/app.js"></script>
</body>
</html>
